name: Publish Auto Update Assets

on:
  push:
    branches:
      - main
    paths:
      - TNP_Sketch_Cut.rbz
      - version.txt
      - .github/workflows/publish-auto-update-assets.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate update files
        shell: bash
        run: |
          set -euo pipefail
          test -f version.txt
          test -f TNP_Sketch_Cut.rbz
          test "$(head -c 2 TNP_Sketch_Cut.rbz)" = "PK"

      - name: Publish fixed release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="auto-update-stable"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "TNP Sketch Cut Auto Update" \
              --notes "Stable download assets used by TNP Sketch Cut Auto Update."
          fi
          gh release upload "$TAG" version.txt TNP_Sketch_Cut.rbz --clobber

      - name: Record published asset status
        shell: bash
        run: |
          set -euo pipefail
          printf 'tag=auto-update-stable\ncommit=%s\nversion_url=https://github.com/PnToan/TNP_Gcode/releases/download/auto-update-stable/version.txt\nrbz_url=https://github.com/PnToan/TNP_Gcode/releases/download/auto-update-stable/TNP_Sketch_Cut.rbz\n' "$GITHUB_SHA" > auto_update_release_status.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add auto_update_release_status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update auto-update release status'
            git push
          fi
